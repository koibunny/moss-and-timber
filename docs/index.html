<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111810" />
    <meta
      name="description"
      content="苔痕小屋：一座藏在松林里的原木小屋。柔和体积光、丁达尔光束与可切换的晴天、雾天、黄昏。"
    />
    <title>苔痕小屋 · Moss &amp; Timber</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23182017'/%3E%3Cpath d='M8 24 16 8l8 16M11 24V15h10v9' fill='none' stroke='%23d9cba9' stroke-width='1.4'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-B-5DlD0Z.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CE4L-xPs.css">
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="可交互的 3D 森林小屋场景"></canvas>

      <div class="ui-layer" id="ui">
        <header class="masthead">
          <div class="brand">
            <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true">
              <path d="M7 31 20 7l13 24" />
              <path d="M12 31V19h16v12" />
              <path d="M20 19v12M16 23h8" />
            </svg>
            <div>
              <p class="brand__eyebrow">A quiet place in the woods</p>
              <h1>苔痕小屋</h1>
              <p class="brand__sub">Moss &amp; Timber <span>·</span> 林间光影</p>
            </div>
          </div>
        </header>

        <div class="weather-panel" role="group" aria-label="切换天气与光线">
          <span class="weather-panel__label">天气</span>
          <div class="weather-switch">
            <button class="weather-btn is-active" type="button" data-weather="sunny" aria-pressed="true">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="10" r="3.2" />
                <path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M15.8 4.2l-1.5 1.5M5.7 14.3l-1.5 1.5" />
              </svg>
              <span>晴天</span>
            </button>
            <button class="weather-btn" type="button" data-weather="foggy" aria-pressed="false">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M3.2 6.6h10.2M6.3 9.9h10.5M3.7 13.2h9.4" />
              </svg>
              <span>雾天</span>
            </button>
            <button class="weather-btn" type="button" data-weather="dusk" aria-pressed="false">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M2.8 14.2h14.4M5.1 14.2a4.9 4.9 0 0 1 9.8 0" />
                <path d="M10 3.2v1.9M4.1 6.7l1.4 1.4M15.9 6.7l-1.4 1.4" />
              </svg>
              <span>黄昏</span>
            </button>
          </div>
        </div>

        <aside class="place-caption">
          <span class="place-caption__rule"></span>
          <div>
            <p class="place-caption__eyebrow">林间居所 · 46°N</p>
            <p class="place-caption__line">光穿过松针，落在安静的屋顶上。</p>
          </div>
        </aside>

        <div class="interaction-hint" aria-hidden="true">
          <span class="interaction-hint__desktop">拖拽环顾 <i></i> 滚轮缩放</span>
          <span class="interaction-hint__mobile">单指环顾 <i></i> 双指缩放</span>
        </div>

        <button class="reset-view" type="button" id="resetView" aria-label="重置视角" title="重置视角">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4.8 9.2A7.5 7.5 0 1 1 5 15M4.8 9.2V4.7M4.8 9.2h4.5" />
          </svg>
        </button>

        <div class="frame-line frame-line--tl"></div>
        <div class="frame-line frame-line--br"></div>
      </div>

      <section class="loader" id="loader" aria-live="polite">
        <div class="loader__wash"></div>
        <div class="loader__content">
          <svg class="loader__mark" viewBox="0 0 64 64" aria-hidden="true">
            <path class="loader__draw" d="M10 52 32 12l22 40" />
            <path class="loader__draw loader__draw--late" d="M18 52V32h28v20M32 32v20M24 40h16" />
            <path class="loader__draw loader__draw--late" d="M7 52h50" />
          </svg>
          <p class="loader__eyebrow">Forest study · No. 08</p>
          <h2>苔痕小屋</h2>
          <p class="loader__sub">Moss &amp; Timber</p>
          <div class="loader__bar"><span id="loaderBar"></span></div>
          <div class="loader__meta">
            <span id="loaderStatus">正在唤醒松林…</span>
            <span id="loaderPercent">0%</span>
          </div>
        </div>
        <p class="loader__foot">等一束光，慢慢穿过松林。</p>
      </section>

      <noscript>
        <div class="noscript">这个场景需要启用 JavaScript 才能进入。</div>
      </noscript>
    </main>

  </body>
</html>
